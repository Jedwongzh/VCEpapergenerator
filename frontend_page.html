<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VCE Exam Generator - JTutes</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            max-width: 650px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 50px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3), 0 0 0 1px rgba(255,255,255,0.1);
            animation: slideUp 0.5s ease-out;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .header h1 {
            color: #1a1a1a;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .header p {
            color: #666;
            font-size: 16px;
        }
        
        .form-group {
            margin-bottom: 24px;
        }
        
        label {
            display: block;
            margin-bottom: 10px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        input, select {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            background: white;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }
        
        input:hover, select:hover {
            border-color: #cbd5e1;
        }
        
        .input-hint {
            font-size: 13px;
            color: #6b7280;
            margin-top: 6px;
            font-style: italic;
        }
        
        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }
        
        button:active:not(:disabled) {
            transform: translateY(0);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        #result {
            margin-top: 30px;
            padding: 24px;
            border-radius: 12px;
            text-align: center;
            animation: fadeIn 0.3s ease-out;
            display: none;
        }
        
        #result.show {
            display: block;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        .success {
            background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
            color: #155724;
            border: 2px solid #b1dfbb;
        }
        
        .error {
            background: linear-gradient(135deg, #f8d7da 0%, #f5c6cb 100%);
            color: #721c24;
            border: 2px solid #f1b0b7;
        }
        
        .loading {
            background: linear-gradient(135deg, #d1ecf1 0%, #bee5eb 100%);
            color: #0c5460;
            border: 2px solid #abdde5;
        }
        
        .result-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        
        .result-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        .result-message {
            font-size: 15px;
            margin-bottom: 16px;
            opacity: 0.9;
        }
        
        .download-btn {
            display: inline-block;
            margin-top: 16px;
            padding: 14px 32px;
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(40, 167, 69, 0.4);
        }
        
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 3px solid #0c5460;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .topic-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }
        
        .topic-tag {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 30px 24px;
            }
            
            .header h1 {
                font-size: 26px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎓 VCE Exam Generator</h1>
            <p>Create custom practice exams tailored to your needs</p>
        </div>
        
        <form id="examForm">
            <div class="form-group">
                <label for="yearLevel">📚 Year Level</label>
                <select id="yearLevel" required>
                    <option value="">Select Year Level</option>
                    <option value="Year 11">Year 11</option>
                    <option value="Year 12">Year 12</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="topics">📝 Topics</label>
                <input 
                    type="text" 
                    id="topics" 
                    placeholder="e.g., Calculus, Algebra, Trigonometry" 
                    required
                >
                <div class="input-hint">Separate multiple topics with commas</div>
            </div>
            
            <div class="form-group">
                <label for="difficulty">⚡ Difficulty Level</label>
                <select id="difficulty" required>
                    <option value="">Select Difficulty</option>
                    <option value="easy">Easy - Foundation concepts</option>
                    <option value="medium">Medium - Standard practice</option>
                    <option value="hard">Hard - Challenge yourself</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="numQuestions">🔢 Number of Questions</label>
                <input 
                    type="number" 
                    id="numQuestions" 
                    min="1" 
                    max="20" 
                    value="5" 
                    required
                >
                <div class="input-hint">Choose between 1-20 questions</div>
            </div>
            
            <button type="submit" id="submitBtn">
                Generate Exam Paper
            </button>
        </form>
        
        <div id="result"></div>
    </div>
    
    <script>
        // IMPORTANT: Replace this with your actual domain or VPS IP
        const API_URL = 'http://localhost:8000'; // e.g., 'https://api.jtutes.com' or 'http://YOUR_VPS_IP'
        
        const form = document.getElementById('examForm');
        const submitBtn = document.getElementById('submitBtn');
        const resultDiv = document.getElementById('result');
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Get form values
            const yearLevel = document.getElementById('yearLevel').value;
            const topicsInput = document.getElementById('topics').value;
            const topics = topicsInput
                .split(',')
                .map(t => t.trim())
                .filter(t => t.length > 0);
            const difficulty = document.getElementById('difficulty').value;
            const numQuestions = parseInt(document.getElementById('numQuestions').value);
            
            // Validate
            if (!yearLevel || topics.length === 0 || !difficulty) {
                showResult('error', '⚠️', 'Missing Information', 'Please fill in all required fields');
                return;
            }
            
            // Show loading state
            submitBtn.disabled = true;
            submitBtn.textContent = 'Generating...';
            showResult('loading', '', 'Generating Your Exam', 'This may take a minute. Our AI is creating custom questions for you...', true);
            
            try {
                const response = await fetch(`${API_URL}/api/generate-paper`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        year_level: yearLevel,
                        topics: topics,
                        difficulty: difficulty,
                        num_questions: numQuestions
                    })
                });
                
                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.detail || 'Failed to generate exam');
                }
                
                const data = await response.json();
                
                // Display success with download link
                const topicTags = topics.map(t => `<span class="topic-tag">${t}</span>`).join('');
                const downloadHTML = `
                    <div class="result-icon">✅</div>
                    <div class="result-title">Your Exam is Ready!</div>
                    <div class="result-message">
                        Generated ${data.questions.length} ${difficulty} level questions
                    </div>
                    <div class="topic-tags">${topicTags}</div>
                    <a href="${API_URL}${data.pdf_url}" class="download-btn" download>
                        📥 Download PDF
                    </a>
                `;
                
                resultDiv.innerHTML = downloadHTML;
                resultDiv.className = 'success show';
                
            } catch (error) {
                console.error('Error:', error);
                showResult(
                    'error', 
                    '❌', 
                    'Generation Failed', 
                    error.message || 'Unable to generate exam. Please try again or contact support.'
                );
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Generate Exam Paper';
            }
        });
        
        function showResult(type, icon, title, message, showSpinner = false) {
            const spinnerHTML = showSpinner ? '<div class="spinner"></div>' : '';
            const iconHTML = icon ? `<div class="result-icon">${icon}</div>` : '';
            
            resultDiv.innerHTML = `
                ${spinnerHTML}
                ${iconHTML}
                <div class="result-title">${title}</div>
                <div class="result-message">${message}</div>
            `;
            resultDiv.className = `${type} show`;
        }
    </script>
</body>
</html>
